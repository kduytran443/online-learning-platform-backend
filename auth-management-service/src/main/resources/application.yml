spring:
  application:
    name: 'auth-management-service'
  config:
    import: optional:configserver:${CONFIG_SERVICE_URL:http://localhost:8071/}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true
  datasource:
    url: jdbc:postgresql://${DATASOURCE_URL:localhost:5443/auth_db}
    username: ${DATASOURCE_USERNAME:user}
    password: ${DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/OLP
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1m

server:
  port: 8160

olp:
  frontend-redirect-uri: ${FE_REDIRECT_URL}

management:
  info:
    env:
      enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      enabled: true

info:
  app:
    name: "auth-management-service"
    description: "Auth Management Service"
    version: "1.0.0"

logging:
  level:
    com.kduytran.authmanagementservice: debug
    org:
      springframework:
        web: DEBUG
        security: DEBUG
        web.servlet.DispatcherServlet: DEBUG

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8070/eureka/}

keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: OLP
  resource: auth-management-service
  secret: ${KEYCLOAK_CLIENT_SECRET}

---
spring:
  profiles:
    active: "TEMPDB"
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
