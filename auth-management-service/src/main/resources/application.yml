spring:
  application:
    name: 'auth-management'
  config:
    import: "optional:configserver:http://localhost:8071/"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5436/olp_test_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID:CLIENT-ID}
            client-secret: ${CLIENT_SECRET:CLIENT-SECRET}
            scope:
              - email
              - profile

server:
  port: 8160

olp:
  dummy-topic: "dummy-value"
  secured-token: false
  jwt:
    token-exp: PT10M
    refresh-token-exp: P7D
    public-key-path: ${PUBLIC_KEY:PUBLIC-KEY}
    private-key-path: ${PRIVATE_KEY:PRIVATE-KEY}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  frontend-login-success-path: ${FRONTEND_LOGIN_SUCCESS_PATH:login-success}
  security:
    roles:
      - name: ADMIN
        permissions:
          - LESSON_READ
          - LESSON_CREATE
          - LESSON_UPDATE
          - LESSON_DELETE
          - TOPIC_READ
          - TOPIC_CREATE
          - TOPIC_UPDATE
          - TOPIC_DELETE
      - name: USER
        permissions:
          - LESSON_READ
          - LESSON_CREATE
          - LESSON_UPDATE
          - LESSON_DELETE
          - TOPIC_READ
          - TOPIC_CREATE
          - TOPIC_UPDATE
          - TOPIC_DELETE

management:
  info:
    env:
      enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      enabled: true

info:
  app:
    name: "auth-management-service"
    description: "Auth Management Service"
    version: "1.0.0"

logging:
  level:
    com.kduytran.authmanagementservice: debug
    org:
      springframework:
        web: DEBUG
        security: DEBUG
        web.servlet.DispatcherServlet: DEBUG

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"
