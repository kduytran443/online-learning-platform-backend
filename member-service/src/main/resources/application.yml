spring:
  application:
    name: "member"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: "jdbc:postgresql://localhost:5440/member_db"
    username: "user"
    password: "password"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: create
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      bootstrap-servers: localhost:29092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            "use.type.headers": false
#    streams:
#      application-id: "member-service-stream-app"
#      bootstrap-servers: localhost:19092
#      default-key-serde: org.apache.kafka.common.serialization.Serdes$StringSerde
#      default-value-serde: org.apache.kafka.common.serialization.Serdes$JsonSerde

server:
  port: 8150
management:
  opentelemetry:
    resource-attributes:
      cluster: local
      "service.name": ${spring.application.name}
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 5s
        enabled: true
    tracing:
      endpoint: http://localhost:4318/v1/traces
      timeout: 1m
  tracing:
    sampling:
      probability: 1.0
    enabled: true
  #  zipkin:
  #    tracing:
  #      endpoint: http://localhost:9411/api/v2/spans
  #      encoding: JSON
  #      connect-timeout: 1s
  info:
    env:
      enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      enabled: true

info:
  app:
    name: "member"
    description: "Member service"
    version: "1.0.0"

logging:
  level:
    com.kduytran.memberservice: debug

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"

resilience4j:
  retry:
    instances:
      feignClientRetry:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 1.5
        exponential-max-wait-duration:
          seconds: 5
        retry-exceptions:
          - java.io.IOException
          - java.net.ConnectException
          - java.net.UnknownHostException
          - feign.RetryableException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      feignClientCircuitBreaker:
        register-health-indicator: true
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 1
